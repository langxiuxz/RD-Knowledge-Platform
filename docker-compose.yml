services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-study_agent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [study-agent]

  redis:
    image: redis:7-alpine
    command: >-
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then redis-server --requirepass "$${REDIS_PASSWORD}"; else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [study-agent]

  ai:
    build: ./study-agent-ai
    environment:
      APP_NAME: study-agent-ai
      HOST: 0.0.0.0
      PORT: 8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
      SPRING_BOOT_BASE_URL: http://server:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      server:
        condition: service_started
    networks: [study-agent]

  server:
    build: ./study-agent-server
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-study_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
      AI_SERVICE_BASE_URL: http://ai:8000
      FLYWAY_ENABLED: "true"
      FILE_STORAGE_ROOT: /app/data/files
      FILE_PUBLIC_BASE_URL: http://server:8080/internal/files
    volumes:
      - file-data:/app/data/files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [study-agent]

  web:
    build:
      context: ./study-agent-web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_started
    networks: [study-agent]

volumes:
  mysql-data:
  redis-data:
  file-data:

networks:
  study-agent:
    driver: bridge
