services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-study_agent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [study-agent]

  redis:
    image: redis:7-alpine
    command: >-
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then redis-server --requirepass "$${REDIS_PASSWORD}"; else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [study-agent]

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [study-agent]

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_USER:?Set MILVUS_MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD:?Set MILVUS_MINIO_PASSWORD in .env}
    command: minio server /data
    volumes:
      - milvus-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [study-agent]

  milvus:
    image: milvusdb/milvus:v2.6.3
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MQ_TYPE: woodpecker
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_USER:?Set MILVUS_MINIO_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_PASSWORD:?Set MILVUS_MINIO_PASSWORD in .env}
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks: [study-agent]

  ai:
    build: ./study-agent-ai
    environment:
      APP_NAME: study-agent-ai
      HOST: 0.0.0.0
      PORT: 8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
      SPRING_BOOT_BASE_URL: http://server:8080
      VECTOR_STORE_PROVIDER: milvus
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-study_agent_local_hash_v1}
      MILVUS_TIMEOUT: ${MILVUS_TIMEOUT:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      milvus:
        condition: service_healthy
      server:
        condition: service_started
    networks: [study-agent]

  server:
    build: ./study-agent-server
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-study_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
      AI_SERVICE_BASE_URL: http://ai:8000
      FLYWAY_ENABLED: "true"
      FILE_STORAGE_ROOT: /app/data/files
      FILE_PUBLIC_BASE_URL: http://server:8080/internal/files
    volumes:
      - file-data:/app/data/files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [study-agent]

  web:
    build:
      context: ./study-agent-web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_started
    networks: [study-agent]

volumes:
  milvus-data:
  milvus-etcd-data:
  milvus-minio-data:
  mysql-data:
  redis-data:
  file-data:

networks:
  study-agent:
    driver: bridge
